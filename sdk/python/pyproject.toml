[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arczk-agent"
version = "0.1.0"
description = "Autonomous AI Agent SDK for ArcNano Shielded Zero-Knowledge Nanopayments on Arc"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Trymbak Mahant", email = "trymbakmahant@gmail.com"}
]
keywords = [
    "arcnano",
    "zk-proofs",
    "x402",
    "ai-agents",
    "langchain",
    "crewai",
    "micropayments",
    "arc-network",
    "groth16",
    "zero-knowledge",
    "autonomous-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent"
]
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/Trymbakmahant/arcnano"
Documentation = "https://github.com/Trymbakmahant/arcnano"
Repository = "https://github.com/Trymbakmahant/arcnano"
"Bug Tracker" = "https://github.com/Trymbakmahant/arcnano/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "twine>=4.0.0"
]
langchain = [
    "langchain-core>=0.1.0"
]
crewai = [
    "crewai>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arczk*"]
